<!doctype html>
<!-- CC Opus 5.5 — DC Film Slate page template; slate.py fills the title and the data block below. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>DC Film Slate · November 5–11, 2026</title>
<style>
:root{--r:10px;--font-h:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",Arial,sans-serif;
 --font-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--font-s:"Iowan Old Style",Georgia,"Times New Roman",serif}
[data-theme=dark]{--bg:#0e0e10;--panel:#17171b;--panel2:#1e1e23;--line:#2b2b31;--ink:#f3efe6;--mute:#9b978e;--faint:#5d5a54;
 --accent:#ff4a4f;--amber:#f2b33d;--chip:#24242a;--chipon:#f3efe6;--chipink:#0e0e10;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#f7f4ee;--panel:#fffdf9;--panel2:#f0ece4;--line:#e2ddd2;--ink:#151413;--mute:#6c675e;--faint:#a8a299;
 --accent:#c8102e;--amber:#a86a00;--chip:#ebe6dc;--chipon:#151413;--chipink:#fffdf9;--shadow:0 10px 30px rgba(0,0,0,.12)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
.sprockets{height:14px;background:radial-gradient(circle at 9px 7px,var(--bg) 3.2px,transparent 3.6px) 0 0/18px 14px,var(--accent)}
header.top{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{font:800 46px/0.9 var(--font-h);font-stretch:condensed;letter-spacing:-.5px;text-transform:uppercase;margin:0}
.brand span{color:var(--accent)}
.issue{font:600 14px var(--font-ui);text-transform:uppercase;letter-spacing:1.5px;color:var(--mute);margin-top:8px}
.issue a{text-decoration:none;padding:2px 8px;border:1px solid var(--line);border-radius:99px;margin:0 2px}
.issue a:hover{border-color:var(--ink)}
.stats{font:14px var(--font-ui);color:var(--mute)}.stats b{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;cursor:pointer}
/* highlights */
h2.sec{font:800 22px var(--font-h);font-stretch:condensed;text-transform:uppercase;letter-spacing:.3px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font:500 13px var(--font-ui);text-transform:none;color:var(--mute);letter-spacing:0}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.card{scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:5px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card{transition:transform .15s,box-shadow .15s}
.card .when{font:700 12px var(--font-ui);letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.card .ct{font:800 19px/1.1 var(--font-h);font-stretch:condensed;text-transform:uppercase}
.card .cv{font-size:13px;color:var(--mute)}
/* layout */
.layout{display:grid;grid-template-columns:270px 1fr;gap:26px;margin-top:8px}
aside.filters{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding:4px 4px 30px 0}
.fgroup{margin:0 0 16px}.fgroup h3{font:700 11px var(--font-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:5px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.1}
.chip .n{font-size:11px;color:var(--mute)}.chip[aria-pressed=true]{background:var(--chipon);color:var(--chipink);border-color:var(--chipon)}
.chip[aria-pressed=true] .n{color:inherit;opacity:.7}.chip.zero{opacity:.38}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.search{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.band{font-size:11px;color:var(--faint);margin:8px 0 4px}
.clear{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:4px 10px;cursor:pointer;text-align:center;line-height:1.1;flex:none}
.day b{display:block;font:800 17px var(--font-h);font-stretch:condensed}.day small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}.day[aria-pressed=true] small{color:#fff}
.day.today small::after{content:" · today"}
.spacer{flex:1}select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px}
#fbtn{display:none}
/* results */
.summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mute);font-size:14px;margin:14px 0 4px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.pill::after{content:" ✕";color:var(--mute)}
h3.dayh{font:800 26px var(--font-h);font-stretch:condensed;text-transform:uppercase;margin:24px 0 2px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.note{font-size:12.5px;color:var(--mute);margin:6px 0}
.vh{display:flex;align-items:center;gap:8px;font:700 12px var(--font-ui);letter-spacing:1.3px;text-transform:uppercase;margin:18px 0 4px;color:var(--mute)}
.vh .vn{color:var(--ink)}.vh .mt{font-weight:500;letter-spacing:0;text-transform:none}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 18px;padding:10px 0;border-bottom:1px solid var(--line)}
.ttl{font:800 19px/1.15 var(--font-h);font-stretch:condensed;text-transform:uppercase;margin:0}
.ttl a{text-decoration:none}.ttl a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.cred{font:15px var(--font-s);color:var(--mute)}.ser{font:italic 14px var(--font-s);color:var(--ink);opacity:.85}
.times{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:flex-start;max-width:360px}
.tm{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font:600 13px var(--font-ui);cursor:pointer;white-space:nowrap}
.tm:hover{border-color:var(--accent)}.tm.past{opacity:.35;text-decoration:line-through}.tm em{font-style:normal;color:var(--amber);font-size:11px}
.b{display:inline-block;font:700 10px var(--font-ui);letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);margin-left:6px;vertical-align:3px;color:var(--mute)}
.b.film{background:var(--amber);border-color:var(--amber);color:#111}.b.guests{border-color:var(--accent);color:var(--accent)}
.b.free{border-color:var(--mute)}.b.new{opacity:.75}
.trow{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.trow .tt{font:800 18px var(--font-h);font-stretch:condensed}
.row>div,.trow>div,.fvenue>div{min-width:0}.ttl,.cred,.ser,.card .ct{overflow-wrap:anywhere}.tv>span:last-child{min-width:0}
html,body{overflow-x:clip}.layout>*{min-width:0}
.trow .tv{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:2px}
.now{display:flex;align-items:center;gap:8px;color:var(--accent);font:700 11px var(--font-ui);letter-spacing:1.4px;text-transform:uppercase;margin:6px 0}
.now::after{content:"";flex:1;height:1px;background:var(--accent)}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.fcard .ttl{font-size:22px}.fvenue{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 12px;margin-top:9px;align-items:start}
.fvenue .vlab{font-size:13px;display:flex;gap:6px;align-items:center;padding-top:5px}.fvenue .times{justify-content:flex-start;max-width:none}
.vcard{margin:8px 0 26px}.vcard h3{font:800 28px var(--font-h);font-stretch:condensed;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:center}
.vmeta{font-size:13px;color:var(--mute)}.vmeta a{color:var(--mute)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
/* popover */
.pop{position:fixed;z-index:50;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px}
.pop .ph{font:800 18px/1.1 var(--font-h);font-stretch:condensed;text-transform:uppercase}.pop .pw{font-size:13px;color:var(--mute);margin:4px 0 10px}
.pop a,.pop button.pa{display:block;width:100%;text-align:left;text-decoration:none;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer;font-size:14px}
.pop a:hover,.pop button.pa:hover{border-color:var(--accent)}.pop a.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
/* tables, footer */
table.vt{width:100%;border-collapse:collapse;font-size:13.5px}table.vt td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.vt td.c{color:var(--mute)}footer{color:var(--mute);font-size:12.5px;padding:26px 0 60px}
kbd{font:11px var(--font-ui);border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* phone */
@media (max-width:900px){
 .layout{grid-template-columns:1fr}.brand{font-size:36px}
 aside.filters{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:78vh;z-index:40;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:16px 18px 40px;transform:translateY(105%);transition:transform .22s ease;box-shadow:var(--shadow)}
 body.sheet aside.filters{transform:none}#fbtn{display:inline-block}
 .row{grid-template-columns:1fr}.times{justify-content:flex-start;max-width:none}
 .fvenue{grid-template-columns:1fr}.fvenue .vlab{padding-top:0}
 table.vt{display:block;overflow-x:auto}table.vt td{white-space:nowrap}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;display:none}body.sheet .scrim{display:block}
}
@media (max-width:520px){.strip{grid-auto-columns:78%}.trow{grid-template-columns:64px 1fr}}
</style>
</head>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const S = D.screenings, V = D.venues, BYID = Object.fromEntries(S.concat(D.coming).map(s => [s.id, s]));
const PRINTS = ["35mm", "70mm", "16mm"];
const PALETTE = ["#ff4a4f", "#f2b33d", "#4cc9f0", "#90be6d", "#c77dff", "#ff8fab", "#2ec4b6", "#f8961e", "#5e7ce2", "#d4e157", "#d9d4ca", "#a47148"];
const VKEYS = Object.keys(V).sort((a, b) => V[a].metro - V[b].metro || V[a].name.localeCompare(V[b].name));
VKEYS.forEach((k, i) => V[k].color = PALETTE[i % PALETTE.length]);
const $ = (q, el = document) => el.querySelector(q);
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

/* ---- time ---- */
function nyParts(date) {
  const p = new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", hourCycle: "h23", year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"}).formatToParts(date);
  const g = t => +p.find(x => x.type === t).value;
  return [g("year"), g("month"), g("day"), g("hour") % 24, g("minute")];
}
const pad = n => String(n).padStart(2, "0");
const NOW = (() => { const [y, m, d, h, mi] = nyParts(new Date()); return `${y}-${pad(m)}-${pad(d)}T${pad(h)}:${pad(mi)}`; })();
const TODAY = NOW.slice(0, 10);
function nyToDate(local) {  // "YYYY-MM-DDTHH:MM" in New York -> Date
  const [Y, Mo, Da, H, Mi] = local.match(/\d+/g).map(Number);
  let t = Date.UTC(Y, Mo - 1, Da, H, Mi);
  for (let i = 0; i < 2; i++) {
    const [y, m, d, h, mi] = nyParts(new Date(t));
    t += Date.UTC(Y, Mo - 1, Da, H, Mi) - Date.UTC(y, m - 1, d, h, mi);
  }
  return new Date(t);
}
function clock(s) { let H = +s.slice(11, 13), M = +s.slice(14, 16); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return M ? `${H}:${pad(M)}${ap}` : `${H}${ap}`; }
const dayDate = d => new Date(d + "T12:00:00");
const dLabel = (d, o) => dayDate(d).toLocaleDateString("en-US", o);
const tod = s => { const h = +s.s.slice(11, 13); return h < 17 ? "mat" : h < 21 ? "eve" : "late"; };
const isEvent = s => s.fl.includes("guests") || s.fl.includes("one night only");
const decade = s => s.y ? String(Math.floor(s.y / 10) * 10) : null;

/* ---- state, kept in the address ---- */
const DEF = {view: "schedule", day: "", group: "venue", sort: "next", q: "", ven: [], max: 0, kind: [], film: false, tod: [], dec: [], free: false};
let st = structuredClone(DEF);
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  st = structuredClone(DEF);
  for (const [k, v] of p) {
    if (!(k in DEF)) continue;
    if (Array.isArray(DEF[k])) st[k] = v ? v.split(",") : [];
    else if (typeof DEF[k] === "boolean") st[k] = v === "1";
    else if (typeof DEF[k] === "number") st[k] = +v || 0;
    else st[k] = v;
  }
}
function writeHash() {
  const p = new URLSearchParams();
  for (const k in DEF) {
    const v = st[k], d = DEF[k];
    if (Array.isArray(d) ? v.length : v !== d) p.set(k, Array.isArray(v) ? v.join(",") : typeof v === "boolean" ? "1" : v);
  }
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
const DAYS = D.days.map(d => d.date);
const curDay = () => st.day === "all" ? "all" : DAYS.includes(st.day) ? st.day : DAYS.includes(TODAY) ? TODAY : DAYS[0];

/* ---- filtering ---- */
const hay = s => (s.t + " " + s.d + " " + s.se + " " + s.vl + " " + (s.n || []).join(" ")).toLowerCase();
const TESTS = {
  q: s => !st.q || st.q.toLowerCase().split(/\s+/).every(w => hay(s).includes(w)),
  ven: s => !st.ven.length || st.ven.includes(s.v),
  max: s => !st.max || V[s.v].metro <= st.max,
  kind: s => !st.kind.length || st.kind.some(k => k === "event" ? isEvent(s) : s.k === k),
  film: s => !st.film || PRINTS.includes(s.f),
  tod: s => !st.tod.length || st.tod.includes(tod(s)),
  dec: s => !st.dec.length || st.dec.includes(decade(s)),
  free: s => !st.free || s.fr,
};
const dayOK = s => st.view !== "schedule" || curDay() === "all" || s.s.startsWith(curDay());
const pass = (s, skip) => Object.keys(TESTS).every(g => g === skip || TESTS[g](s));
const count = (skip, f) => S.reduce((n, s) => n + (dayOK(s) && pass(s, skip) && f(s) ? 1 : 0), 0);
const active = () => Object.keys(TESTS).filter(g => Array.isArray(DEF[g]) ? st[g].length : st[g] !== DEF[g]).length;

/* ---- pieces ---- */
function badges(s, items = [s]) {
  const fl = new Set(items.flatMap(i => i.fl)), fmts = new Set(items.map(i => i.f).filter(f => PRINTS.includes(f)));
  let b = [...fmts].map(f => `<span class="b film">${esc(f)}</span>`).join("");
  if (fl.has("guests")) b += `<span class="b guests">guests</span>`;
  if (fl.has("restoration")) b += `<span class="b">restoration</span>`;
  if (fl.has("one night only")) b += `<span class="b">one night only</span>`;
  if (items.some(i => i.fr)) b += `<span class="b free">free</span>`;
  if (s.nr) b += `<span class="b new">new</span>`;
  return b;
}
const credits = s => [s.d, s.y, s.r ? s.r + " min" : ""].filter(Boolean).join(" · ");
function timeBtn(s, label) {
  const note = (s.n || []).filter(n => /caption/i.test(n)).length ? " <em>CC</em>" : "";
  return `<button class="tm${s.s < NOW ? " past" : ""}" data-id="${s.id}">${esc(label || clock(s.s))}${note}</button>`;
}
function filmRow(items) {
  const s = items[0], notes = [...new Set(items.flatMap(i => (i.n || []).filter(n => !/caption/i.test(n))))];
  const ser = [s.se, ...notes].filter(Boolean).join(" · ");
  return `<div class="row"><div><h4 class="ttl"><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>${badges(s, items)}</h4>`
    + (credits(s) ? `<div class="cred">${esc(credits(s))}</div>` : "") + (ser ? `<div class="ser">${esc(ser)}</div>` : "")
    + `</div><div class="times">${items.map(i => timeBtn(i)).join("")}</div></div>`;
}
const vhead = (key, label) => `<div class="vh"><span class="dot" style="background:${V[key].color}"></span><span class="vn">${esc(label)}</span>`
  + `<span class="mt">· ${esc(V[key].area)} · ~${V[key].metro} min</span></div>`;
function groupBy(list, key) { const m = new Map(); for (const s of list) { const k = key(s); if (!m.has(k)) m.set(k, []); m.get(k).push(s); } return m; }
const byStart = (a, b) => a.s < b.s ? -1 : a.s > b.s ? 1 : 0;
const sortTitle = t => t.replace(/^(the|a|an)\s+/i, "");

/* ---- views ---- */
function schedule(list) {
  const day = curDay(), days = day === "all" ? DAYS : [day];
  let html = "";
  for (const d of days) {
    const items = list.filter(s => s.s.startsWith(d)).sort(byStart);
    const meta = D.days.find(x => x.date === d);
    html += `<h3 class="dayh">${esc(dLabel(d, {weekday: "long", month: "long", day: "numeric"}))}</h3>`;
    if (meta.unposted.length) html += `<div class="note">Times not posted yet: ${esc(meta.unposted.join(", "))}.</div>`;
    if (!items.length) { html += `<div class="note">Nothing matches on this day.</div>`; continue; }
    if (st.group === "time") {
      let nowShown = d !== TODAY;
      for (const s of items) {
        if (!nowShown && s.s >= NOW) { html += `<div class="now">Now · ${clock(NOW)}</div>`; nowShown = true; }
        html += `<div class="trow"><div class="tt">${timeBtn(s)}</div><div><h4 class="ttl"><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>${badges(s)}</h4>`
          + `<div class="tv"><span class="dot" style="background:${V[s.v].color}"></span><span>${esc(s.vl)} · ~${V[s.v].metro} min</span></div>`
          + (credits(s) ? `<div class="cred">${esc(credits(s))}</div>` : "") + (s.se ? `<div class="ser">${esc(s.se)}</div>` : "") + `</div></div>`;
      }
    } else {
      const byV = groupBy(items, s => s.vl);
      for (const vl of [...byV.keys()].sort()) {
        const its = byV.get(vl);
        html += vhead(its[0].v, vl) + [...groupBy(its, s => s.fk).values()].map(filmRow).join("");
      }
    }
  }
  return html;
}
function films(list) {
  const groups = [...groupBy(list, s => s.fk).values()];
  const next = g => (g.find(s => s.s >= NOW) || g[0]).s;
  const key = {next: g => next(g), title: g => sortTitle(g[0].t).toLowerCase(), year: g => g[0].y || 9999,
    count: g => -g.length, score: g => -Math.max(...g.map(s => s.sc))};
  const k = key[st.sort] || key.next;
  groups.forEach(g => g.sort(byStart));
  groups.sort((a, b) => { const x = k(a), y = k(b); return x < y ? -1 : x > y ? 1 : next(a) < next(b) ? -1 : 1; });
  return groups.map(g => {
    const s = g.find(i => i.d) || g[0], byV = groupBy(g, i => i.vl);
    return `<div class="fcard"><h4 class="ttl"><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>${badges(s, g)}</h4>`
      + (credits(s) ? `<div class="cred">${esc(credits(s))}</div>` : "")
      + ([...new Set(g.map(i => i.se).filter(Boolean))].length ? `<div class="ser">${esc([...new Set(g.map(i => i.se).filter(Boolean))].join(" · "))}</div>` : "")
      + [...byV].map(([vl, its]) => `<div class="fvenue"><div class="vlab"><span class="dot" style="background:${V[its[0].v].color}"></span>${esc(vl)}</div>`
        + `<div class="times">${its.map(i => timeBtn(i, dLabel(i.s.slice(0, 10), {weekday: "short", day: "numeric"}) + " · " + clock(i.s))).join("")}</div></div>`).join("")
      + `<div class="note">${g.length} showing${g.length > 1 ? "s" : ""} this week</div></div>`;
  }).join("");
}
function venues(list) {
  const byV = groupBy(list, s => s.v);
  return VKEYS.filter(k => byV.has(k)).map(k => {
    const v = V[k], its = byV.get(k).sort(byStart);
    let html = `<div class="vcard"><h3><span class="dot" style="background:${v.color};width:12px;height:12px"></span>${esc(v.name)}</h3>`
      + `<div class="vmeta">${esc(v.area)} · ~${v.metro} min by Metro · <a href="${dirs(v)}" target="_blank" rel="noopener">${esc(v.address)}</a> · <a href="${esc(v.url)}" target="_blank" rel="noopener">venue site</a></div>`;
    for (const [d, ds] of groupBy(its, s => s.s.slice(0, 10))) {
      html += `<div class="vh"><span class="vn">${esc(dLabel(d, {weekday: "long", month: "short", day: "numeric"}))}</span></div>`
        + [...groupBy(ds, s => s.fk + "|" + s.p).values()].map(filmRow).join("");
    }
    return html + "</div>";
  }).join("");
}

/* ---- filter panel ---- */
function chip(group, value, label, n, on, dot) {
  return `<button class="chip${n ? "" : " zero"}" aria-pressed="${on}" data-g="${group}" data-val="${esc(value)}">`
    + (dot ? `<span class="dot" style="background:${dot}"></span>` : "") + `${esc(label)} <span class="n">${n}</span></button>`;
}
function panel() {
  const tog = (g, v) => st[g].includes(v);
  const bands = [[15, "Within 15 minutes"], [30, "15 to 30 minutes"], [45, "30 to 45 minutes"], [999, "Farther"]];
  let lo = 0, vhtml = "";
  for (const [hi, lab] of bands) {
    const ks = VKEYS.filter(k => V[k].metro > lo && V[k].metro <= hi);
    lo = hi;
    if (!ks.length) continue;
    vhtml += `<div class="band">${lab}</div><div class="chips">` + ks.map(k => chip("ven", k, V[k].name, count("ven", s => s.v === k), tog("ven", k), V[k].color)).join("") + `</div>`;
  }
  const decs = [...new Set(S.map(decade).filter(Boolean))].sort();
  return `<div class="fgroup"><input class="search" id="q" type="search" placeholder="Search title, director, series" value="${esc(st.q)}" autocomplete="off">`
    + `<div class="note">Press <kbd>/</kbd> to search</div></div>`
    + `<div class="fgroup"><h3>What</h3><div class="chips">`
    + chip("kind", "rep", "Repertory", count("kind", s => s.k === "rep"), tog("kind", "rep"))
    + chip("kind", "new", "New releases", count("kind", s => s.k === "new"), tog("kind", "new"))
    + chip("kind", "event", "Special events", count("kind", isEvent), tog("kind", "event")) + `</div></div>`
    + `<div class="fgroup"><h3>Format</h3><div class="chips">` + chip("film", "1", "On film (35/70/16mm)", count("film", s => PRINTS.includes(s.f)), st.film)
    + chip("free", "1", "Free", count("free", s => s.fr), st.free) + `</div></div>`
    + `<div class="fgroup"><h3>When</h3><div class="chips">`
    + [["mat", "Matinee · before 5pm"], ["eve", "Evening · 5–9pm"], ["late", "Late · 9pm on"]].map(([v, l]) => chip("tod", v, l, count("tod", s => tod(s) === v), tog("tod", v))).join("") + `</div></div>`
    + `<div class="fgroup"><h3>Made in</h3><div class="chips">` + decs.map(d => chip("dec", d, d + "s", count("dec", s => decade(s) === d), tog("dec", d))).join("") + `</div></div>`
    + `<div class="fgroup"><h3>Venues</h3><div class="chips">`
    + [[0, "Any distance"], [15, "≤15 min"], [30, "≤30 min"], [45, "≤45 min"]].map(([m, l]) => `<button class="chip" aria-pressed="${st.max === m}" data-g="max" data-val="${m}">${l}</button>`).join("")
    + `</div>${vhtml}</div>`
    + (active() ? `<button class="clear" id="clearall">Clear all filters</button>` : "");
}

/* ---- render ---- */
function render() {
  const day = curDay();
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.view));
  document.querySelectorAll("#group button").forEach(b => b.setAttribute("aria-pressed", b.dataset.g === st.group));
  $("#days").style.display = st.view === "schedule" ? "" : "none";
  $("#group").style.display = st.view === "schedule" ? "" : "none";
  $("#sort").style.display = st.view === "films" ? "" : "none";
  $("#sort").value = st.sort;
  $("#days").innerHTML = `<button class="day" data-day="all" aria-pressed="${day === "all"}"><small>Whole</small><b>Week</b></button>`
    + DAYS.map(d => `<button class="day${d === TODAY ? " today" : ""}" data-day="${d}" aria-pressed="${d === day}"><small>${dLabel(d, {weekday: "short"})}</small><b>${dLabel(d, {day: "numeric"})}</b></button>`).join("");
  const list = S.filter(s => dayOK(s) && pass(s));
  const nf = new Set(list.map(s => s.fk)).size, nv = new Set(list.map(s => s.v)).size;
  const pills = [];
  if (st.q) pills.push(["q", "", `“${st.q}”`]);
  st.kind.forEach(k => pills.push(["kind", k, {rep: "Repertory", new: "New releases", event: "Special events"}[k]]));
  if (st.film) pills.push(["film", "", "On film"]);
  if (st.free) pills.push(["free", "", "Free"]);
  st.tod.forEach(t => pills.push(["tod", t, {mat: "Matinee", eve: "Evening", late: "Late"}[t]]));
  st.dec.forEach(d => pills.push(["dec", d, d + "s"]));
  if (st.max) pills.push(["max", "", `≤${st.max} min`]);
  st.ven.forEach(v => pills.push(["ven", v, V[v].name]));
  $("#summary").innerHTML = `<span><b style="color:var(--ink)">${list.length}</b> showings of ${nf} film${nf === 1 ? "" : "s"} at ${nv} venue${nv === 1 ? "" : "s"}</span>`
    + pills.map(([g, v, l]) => `<button class="pill" data-g="${g}" data-val="${esc(v)}">${esc(l)}</button>`).join("");
  $("#results").innerHTML = list.length ? (st.view === "films" ? films(list) : st.view === "venues" ? venues(list) : schedule(list))
    : `<div class="empty">Nothing matches these filters. <button class="clear" id="clearall2">Clear filters</button></div>`;
  const qHadFocus = document.activeElement && document.activeElement.id === "q";
  const caret = qHadFocus ? document.activeElement.selectionStart : null;
  $("#filters").innerHTML = panel();
  if (qHadFocus) { const q = $("#q"); q.focus(); q.setSelectionRange(caret, caret); }
  $("#fbtn").textContent = active() ? `Filters · ${active()}` : "Filters";
  writeHash();
}
function staticParts() {
  const i = D.issue;
  $("#issue").innerHTML = (i.prev ? `<a href="${esc(i.prev)}" title="Previous issue">‹</a>` : "") + esc(i.label)
    + (i.next ? `<a href="${esc(i.next)}" title="Next issue">›</a>` : "") + (i.latest ? ` <a href="${esc(i.latest)}">latest</a>` : "");
  const films = new Set(S.map(s => s.fk)).size, prints = S.filter(s => PRINTS.includes(s.f)).length;
  $("#stats").innerHTML = `<b>${S.length}</b> showings · <b>${films}</b> films · <b>${Object.values(V).filter(v => v.count).length}</b> venues · <b>${prints}</b> on film`;
  $("#strip").innerHTML = D.highlights.map(id => BYID[id]).map(s => `<button class="card" data-id="${s.id}">`
    + `<span class="when">${esc(dLabel(s.s.slice(0, 10), {weekday: "short", month: "numeric", day: "numeric"}))} · ${clock(s.s)}</span>`
    + `<span class="ct">${esc(s.t)}</span><span class="cv">${esc([s.d, s.y].filter(Boolean).join(", "))}</span>`
    + `<span class="cv"><span class="dot" style="background:${V[s.v].color}"></span> ${esc(s.vl)}</span><span>${badges(s)}</span></button>`).join("")
    || `<div class="note">Nothing flagged this week.</div>`;
  const cg = groupBy(D.coming.slice().sort(byStart), s => s.s.slice(0, 10));
  $("#coming").innerHTML = [...cg].map(([d, its]) => `<div class="vh"><span class="vn">${esc(dLabel(d, {weekday: "long", month: "short", day: "numeric"}))}</span></div>`
    + its.map(s => `<div class="trow"><div class="tt">${timeBtn(s)}</div><div><h4 class="ttl"><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>${badges(s)}</h4>`
      + `<div class="tv"><span class="dot" style="background:${V[s.v].color}"></span><span>${esc(s.vl)}</span></div>${credits(s) ? `<div class="cred">${esc(credits(s))}</div>` : ""}</div></div>`).join("")).join("")
    || `<div class="note">Nothing flagged yet.</div>`;
  $("#vtable").innerHTML = VKEYS.map(k => { const v = V[k];
    return `<tr><td><span class="dot" style="background:${v.color}"></span> <a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.name)}</a></td>`
      + `<td class="c">${esc(v.area)}</td><td class="c">~${v.metro} min by Metro</td><td class="c"><a href="${dirs(v)}" target="_blank" rel="noopener">${esc(v.address)}</a></td>`
      + `<td class="c">${v.error ? "feed error this week" : v.count + " showings"}</td></tr>`; }).join("")
    + D.notCovered.map(n => `<tr><td><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.name)}</a></td><td class="c" colspan="4">Not listed here: ${esc(n.why)}. Check its site.</td></tr>`).join("");
  $("#foot").innerHTML = `Compiled ${esc(new Date(i.generated).toLocaleString("en-US", {weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit"}))} from the venues’ own listings. `
    + `Times can change: confirm on the venue’s page before you go. Metro times are approximate, door to door.`
    + (D.archive.length ? `<br>Issues: ${D.archive.map(a => `<a href="${esc(a.href)}">${esc(dLabel(a.start, {month: "short", day: "numeric"}))}</a>`).join(" · ")}` : "");
}

/* ---- showtime popover: tickets, calendar, directions, Letterboxd ---- */
const dirs = v => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(v.name + ", " + v.address);
const lboxd = s => "https://letterboxd.com/search/films/" + encodeURIComponent(s.t + (s.y ? " " + s.y : "")) + "/";
function openPop(el, s) {
  const pop = $("#pop"), v = V[s.v];
  pop.innerHTML = `<div class="ph">${esc(s.t)}</div><div class="pw">${esc(dLabel(s.s.slice(0, 10), {weekday: "long", month: "short", day: "numeric"}))} · ${clock(s.s)}<br>${esc(s.vl)}`
    + `${(s.n || []).length ? "<br>" + esc(s.n.join(" · ")) : ""}</div>`
    + `<a class="primary" href="${esc(s.u)}" target="_blank" rel="noopener">Tickets &amp; details ↗</a>`
    + `<button class="pa" data-ics="${s.id}">Add to calendar</button>`
    + `<a href="${dirs(v)}" target="_blank" rel="noopener">Directions · ~${v.metro} min by Metro</a>`
    + `<a href="${lboxd(s)}" target="_blank" rel="noopener">Look up on Letterboxd</a>`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, hgt = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
  pop.style.top = (r.bottom + hgt + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - hgt - 6)) + "px";
}
const closePop = () => { $("#pop").hidden = true; };
function ics(s) {
  const t0 = nyToDate(s.s), t1 = new Date(t0.getTime() + ((s.r || 120) + 15) * 60000), v = V[s.v];
  const z = d => d.toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const tx = x => String(x || "").replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DC Film Slate//EN", "BEGIN:VEVENT",
    `UID:dcfs-${s.v}-${s.s.replace(/\D/g, "")}-${s.fk}@dc-film-slate`, `DTSTAMP:${z(new Date())}`, `DTSTART:${z(t0)}`, `DTEND:${z(t1)}`,
    `SUMMARY:${tx(s.t + " · " + v.name)}`, `LOCATION:${tx(v.name + ", " + v.address)}`, `URL:${tx(s.u)}`,
    `DESCRIPTION:${tx([credits(s), s.se, (s.n || []).join(", "), s.u].filter(Boolean).join("\n"))}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "text/calendar"}));
  a.download = (s.t.replace(/[^\w]+/g, "-").slice(0, 40) + "-" + s.s.slice(0, 10)).toLowerCase() + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---- events ---- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) { if (!e.target.closest("#pop")) closePop(); return; }
  if (t.dataset.ics) { ics(BYID[t.dataset.ics]); closePop(); return; }
  if (t.dataset.id && (t.classList.contains("tm") || t.classList.contains("card"))) { e.stopPropagation(); openPop(t, BYID[t.dataset.id]); return; }
  if (!t.closest("#pop")) closePop();
  if (t.dataset.v) { st.view = t.dataset.v; render(); return; }
  if (t.dataset.g && t.closest("#group")) { st.group = t.dataset.g; render(); return; }
  if (t.dataset.day) { st.day = t.dataset.day; render(); return; }
  if (t.id === "clearall" || t.id === "clearall2") { const keep = {view: st.view, day: st.day, group: st.group, sort: st.sort}; st = {...structuredClone(DEF), ...keep}; render(); return; }
  if (t.id === "theme") { const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; setTheme(n); return; }
  if (t.id === "fbtn") { document.body.classList.toggle("sheet"); return; }
  if (t.dataset.g) {
    const g = t.dataset.g, v = t.dataset.val;
    if (t.classList.contains("pill")) { if (Array.isArray(st[g])) st[g] = st[g].filter(x => x !== v); else st[g] = DEF[g]; render(); return; }
    if (Array.isArray(st[g])) st[g] = st[g].includes(v) ? st[g].filter(x => x !== v) : st[g].concat(v);
    else if (g === "max") st.max = +v;
    else st[g] = !st[g];
    render();
  }
});
$("#scrim").addEventListener("click", () => document.body.classList.remove("sheet"));
$("#sort").addEventListener("change", e => { st.sort = e.target.value; render(); });
document.addEventListener("input", e => { if (e.target.id === "q") { st.q = e.target.value.trim() ? e.target.value : ""; render(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePop(); document.body.classList.remove("sheet"); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); if (innerWidth <= 900) document.body.classList.add("sheet"); $("#q").focus(); }
});
addEventListener("scroll", closePop, {passive: true});
addEventListener("hashchange", () => { readHash(); render(); });
function setTheme(n) { document.documentElement.dataset.theme = n; $("#theme").textContent = n === "dark" ? "☾" : "☀"; try { localStorage.setItem("dcfs-theme", n); } catch (_) {} }
try { const t = localStorage.getItem("dcfs-theme"); if (t) setTheme(t); } catch (_) {}
readHash(); staticParts(); render();
</script>
</body>
</html>
